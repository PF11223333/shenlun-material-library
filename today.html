const days=[{"date":"2026-08-02","title":"今日申论好文与金句积累（2026年8月2日）","titles":["以正确政绩观校准高质量发展坐标","打通科技成果转化的“中间地带”","把每一次预警转化为避险行动"],"expressions":["G504：树立正确政绩观，要以发展规律校准工作冲动，以群众评价检验施政成色。","G505：培育新质生产力，既要增强源头创新供给，也要畅通概念验证、中试孵化和场景应用。","G509：从论文专利到产业产品，中间还隔着验证、资金、场景和市场四道关口。","G510：数据能够提前发现异常，却不能替代叫应、转移、救援和安置等线下行动。","G515：当预警有人接、群众有人转、安置有人管，安全底线才能成为可感可及的民生保障。"],"case":["密云养老照料中心灾害调查： 报告从极端降雨和洪水致灾因素，追溯到监测预警、巡堤查险、先期处置、养老监管等短板，说明自然灾害调查既要尊重科学规律，也要查清治理责任。"],"authority":["Q137： “极端灾害必须以极限思维应对。”"],"classics":[{"quote":"“祸兮福之所倚，福兮祸之所伏。”——《老子》第五十八章","fields":{"字面解释":"灾祸中可能孕育转机，福分中也可能潜藏祸患。","申论释义":"看待发展成绩与风险挑战要坚持辩证思维，在顺境中保持忧患意识。","适用主题":"统筹发展和安全、风险治理、宏观经济、改革创新。","使用边界":"不能把风险与机遇机械等同，更不能以“祸福相依”淡化现实责任。","原创使用例句":"面对经济回升向好的态势，更应懂得“福兮祸之所伏”，主动识别结构性矛盾和外部风险，以底线思维巩固发展向好基础、守牢安全底线。——原创"}},{"quote":"“知止而后有定。”——《礼记·大学》","fields":{"字面解释":"知道应达到的目标和应守的界限，志向才能坚定。","申论释义":"发展未来产业既要明确方向，也要守住能力、资源和安全边界。","适用主题":"正确政绩观、科学决策、科技伦理、干部修养。","使用边界":"“知止”不是停止改革，而是避免盲目跟风和无序扩张。","原创使用例句":"布局未来产业要“知止而后有定”，既瞄准科技前沿积极探索，也根据资源禀赋和产业基础选准赛道，避免盲目追逐风口，提升投入产出效益。——原创"}},{"quote":"“故善战者，求之于势，不责于人。”——《孙子兵法·势篇》","fields":{"字面解释":"善于用兵的人重在营造有利态势，不苛求个体凭蛮力取胜。","申论释义":"改革和创新要靠制度、平台与生态形成合力，不能把系统问题全压给个人。","适用主题":"创新生态、组织治理、干部激励、协同发展。","使用边界":"强调制度环境不等于弱化岗位责任，个人仍须依法履职、担当作为。","原创使用例句":"科技成果转化应当“求之于势，不责于人”，以概念验证、中试平台、耐心资本和应用场景形成合力，而非让科研人员独自跨越市场鸿沟。——原创"}},{"quote":"“履霜，坚冰至。”——《周易·坤卦》初六爻辞","fields":{"字面解释":"踩到薄霜，就应预见严寒和坚冰将至。","申论释义":"风险治理要从细小征兆识别趋势，把处置关口前移。","适用主题":"防灾减灾、公安主防、安全生产、廉政建设。","使用边界":"预见风险必须基于事实和专业研判，不能把一般异常随意上纲。","原创使用例句":"“履霜，坚冰至”，基层防灾要从雨情、水情和设施异常中识别险情苗头，及时叫应并转移群众，不能等灾害扩大后再被动处置，守住生命安全底线。——原创"}},{"quote":"“圣人见微以知萌，见端以知末。”——《韩非子·说林上》","fields":{"字面解释":"从细微迹象看出苗头，从事情开端推知发展结果。","申论释义":"监测预警、经济运行和基层治理都要提升早发现、早研判能力。","适用主题":"风险监测、调查研究、经济治理、矛盾排查。","使用边界":"见微知著不是主观猜测，判断必须经过数据、走访和多方验证。","原创使用例句":"做到“见微以知萌，见端以知末”，既要依靠监测数据捕捉异常，也要通过实地巡查和多方会商验证研判，把隐患消除在成灾之前。——原创"}},{"quote":"“欲筑室者，先治其基。”——北宋苏辙《新论中》","fields":{"字面解释":"想建造坚固房屋，首先要把地基打牢。","申论释义":"高质量发展、科技创新和公共安全都要先夯实基层基础与制度能力。","适用主题":"基层治理、基础研究、组织建设、公共安全。","使用边界":"强基固本不能成为迟滞行动的借口，应在补基础的同时解决紧迫问题。","原创使用例句":"“欲筑室者，先治其基”，建设全球科创高地既要争取重大成果，也要持续投入基础研究、公共平台和人才培养，夯实创新根基，增强持续创新能力。——原创"}}],"demos":[{"title":"“履霜，坚冰至”+密云灾害调查评估","fields":{"推荐位置":"分论点段，用于论证“风险处置关口必须前移”。","原创申论段落":"“履霜，坚冰至。”极端灾害往往来势迅猛，但风险演化并非毫无征兆。密云养老照料中心灾害调查从监测预警、巡堤查险、先期处置和养老监管等环节追溯短板，警示基层不能把一般雨情当作寻常情况。应健全多源监测、分级叫应和特殊群体转移机制，以极限思维把工作做在险情扩大之前。——原创","使用点评":"古文用来引出“见小知大、关口前移”，调查报告提供现实支撑，对策回应问题；不能脱离监测数据主观放大一般异常。"}},{"title":"“故善战者，求之于势，不责于人”+上海科创高地建设","fields":{"推荐位置":"分论点段，用于论证“创新依靠生态而非个人单打独斗”。","原创申论段落":"“故善战者，求之于势，不责于人。”推动科技成果从实验室走向生产线，不能只要求科研人员既懂研究又懂市场。上海建设全球科创高地，启示各地完善概念验证、中试孵化、耐心资本和场景开放机制，推动高校、企业与服务机构协同发力。以制度平台营造创新之“势”，才能让更多成果跨越转化鸿沟。——原创","使用点评":"先把“势”转译为创新生态，再用当日好文承接，最后列出制度工具；同时保留科研人员和企业的主体责任，避免把古文理解为“不责于人”。"}}],"review":["1日复习：2026-08-01——到期：常态化扫黑除恶、退役军人全周期服务、家政员工制、重庆地灾监测、健康中国。","3日复习：2026-07-30——到期：基层实事办理、反网络暴力、精准就业、广东文化传承、重庆融入统一大市场。","7日复习：2026-07-26——到期：统一大市场、重庆城口“熟人社区”、防汛避险转移、数据要素、检察法律监督。","14日复习：2026-07-19——当日无每日积累文件，本轮补复习2026-07-18：随机复述3个主题、2条金句和1条权威论述。"]},{"date":"2026-08-01","title":"今日申论好文与金句积累（2026年8月1日）","titles":["让平安建设既有打击力度更有治理精度","用“电子哨兵”守牢基层防灾第一线","从疾病诊疗迈向全生命周期健康治理"],"expressions":["G489：深化扫黑除恶，必须在依法严惩中保持力度，在实事求是中把准尺度。","G491：基层防灾要让技术监测看得见风险，让网格力量找得到群众，让应急机制跑得赢灾情。","G494：从政策覆盖到服务抵达，中间还隔着需求识别、资源匹配和跟踪反馈三道关口。","G496：要贯通群众举报、数据研判、案件侦办、打伞破网、行业整治和回访评估，形成常态治理闭环。","G500：让人人享有可及、连续、有温度的健康服务，现代化建设才有更加坚实的民生底座。"],"case":["重庆涪陵地灾防线： GNSS“电子哨兵”+网格巡查+道路管控+24小时值守+群众转移，体现技术监测与基层动员协同。"],"authority":["Q133： “要严格依法办事，坚持实事求是，做到是黑恶一个不漏、不是黑恶一个不凑。”"],"classics":[{"quote":"“为政之要，惟在得人，用非其人，必难致治。”——唐·吴兢《贞观政要》","fields":{"字面解释":"治理国家的关键在于选用合适人才，用人不当就难以达到善治。","申论释义":"基层治理、公共卫生和应急处置都需要专业力量与合适岗位精准匹配。","适用主题":"干部队伍、人才强国、基层治理、公共服务。","使用边界":"不能把治理成效完全归因于个人，还须强调制度、资源和监督保障。","原创使用例句":"退役军人服务要落实“为政之要，惟在得人”，既精准识别个人专长，也用岗位开发、技能培训和跟踪帮扶让人岗相适，实现才尽其用、人尽其才。——原创"}},{"quote":"“知是行之始，行是知之成。”——明·王守仁《传习录上》","fields":{"字面解释":"认识是行动的开始，行动是认识的完成。","申论释义":"风险意识、为民理念和法治要求必须转化为具体行动与治理成效。","适用主题":"实干担当、调查研究、应急管理、政策落实。","使用边界":"不能以“重行动”为由忽视科学论证和依法决策。","原创使用例句":"“知是行之始，行是知之成”，地灾监测不能止于发现位移数据，更要及时叫应、转移群众、管控道路，把风险认知变成避险行动，守住生命安全底线。——原创"}},{"quote":"“取法于上，仅得为中；取法于中，故为其下。”——唐·李世民《帝范》卷四","fields":{"字面解释":"以上等标准为目标，结果可能只达中等；以中等为目标，结果往往落到下等。","申论释义":"改革和公共服务应确立高标准，并以可检验的制度持续推进。","适用主题":"高质量发展、改革创新、作风建设、公共服务标准化。","使用边界":"高标准不等于脱离实际、层层加码，更不能制造形式主义负担。","原创使用例句":"家政服务职业化当有“取法于上”的追求，以劳动契约、技能认证和质量追溯树立行业标准，推动服务提质，同时防止脱离实际层层加码。——原创"}},{"quote":"“任贤勿贰，去邪勿疑。”——《尚书·大禹谟》","fields":{"字面解释":"任用贤能不要三心二意，去除不正之人不要迟疑。","申论释义":"选人用人要坚持德才兼备、奖优罚劣，形成担当作为的鲜明导向。","适用主题":"干部管理、政治生态、担当作为、人才使用。","使用边界":"“勿疑”不是主观武断，必须以事实、程序和制度为依据。","原创使用例句":"营造担当作为的干部环境，应坚持“任贤勿贰，去邪勿疑”，让实干者凭实绩脱颖而出，让失责者依规依纪受到约束，形成鲜明用人导向。——原创"}},{"quote":"“一张一弛，文武之道也。”——《礼记·杂记下》","fields":{"字面解释":"弓弦有时拉紧、有时放松，是治理和做事应有的节奏。","申论释义":"公共管理既要严格规范，也要合理调度、关爱基层、保持政策韧性。","适用主题":"基层减负、干部关爱、工作方法、社会治理。","使用边界":"张弛有度不等于降低标准或放松法治要求。","原创使用例句":"基层应急既要在险情来临时迅速进入战时状态，也要在日常合理轮班、常态演练，做到“一张一弛”而责任标准始终不松，保障队伍持续战斗力。——原创"}},{"quote":"“源清则流清，源浊则流浊。”——《荀子·君道》","fields":{"字面解释":"源头清澈，水流就清澈；源头污浊，水流也会污浊。","申论释义":"治理黑恶犯罪、行业乱象和公共风险，要抓源头、治根本、建长效。","适用主题":"源头治理、廉政建设、营商环境、社会治理。","使用边界":"源头治理不能替代对现实违法行为的及时依法处置。","原创使用例句":"“源清则流清，源浊则流浊”，深化扫黑除恶既要依法惩治现行犯罪，也要整治行业乱象、斩断利益链条，铲除黑恶滋生土壤，实现标本兼治。——原创"}}],"demos":[{"title":"“知是行之始，行是知之成”+重庆涪陵地灾监测","fields":{"推荐位置":"分论点段，用于论证“预警必须转化为行动”。","原创申论段落":"“知是行之始，行是知之成。”风险治理的价值，不在于掌握了多少监测数据，而在于能否据此保护群众安全。重庆涪陵布设GNSS设备捕捉滑坡位移后，同步组织网格巡查、道路管控和群众转移，让技术预警进入处置闭环。各地还应明确叫应时限、转移路线和包保责任，真正把风险认知转化为避险实效。——原创","使用点评":"先用古文提出“知行合一”的判断，再接当日案例证明，最后落到机制对策；不能只写“要重视行动”而缺少具体行动链条。"}},{"title":"“源清则流清，源浊则流浊”+深化扫黑除恶","fields":{"推荐位置":"分论点或结尾段，用于论证“打击与源头治理并重”。","原创申论段落":"“源清则流清，源浊则流浊。”深化扫黑除恶，既要以事实和证据依法惩治黑恶犯罪，也要循线深挖利益链、关系网和“保护伞”。针对网络化、隐蔽化、软暴力化新动向，还应贯通线索研判、行业整治和回访评估，及时堵塞监管漏洞。只有打击治标与源头治本协同发力，才能把专项成果沉淀为长效安宁。——原创","使用点评":"古文负责引出“治源”的核心观点，案例和对策负责充实论证；使用时仍要写明依法打击，不能把源头治理替代现实处置。"}}],"review":["1日复习：2026-07-31——当日无每日积累文件，本轮顺延复习2026-07-30：反网络暴力法、精准就业服务、重庆统一大市场。","3日复习：2026-07-29——当日无每日积累文件，本轮补复习2026-07-27：涉灾谣言治理、群众求助办理、红树林保护。","7日复习：2026-07-25——到期：正确政绩观、智慧110、防台风避险、基础研究人才生态。","14日复习：2026-07-18——到期：按当日文件复述3个主题，并随机默写2条金句、1条权威论述。"]},{"date":"2026-07-30","title":"今日申论好文与金句积累（2026年7月30日）","titles":["把群众身边事办成治理   content.innerHTML=simpleSection('titles','必背标题',day.titles,'title')+simpleSection('expressions','必背表达',day.expressions,'expression')+classicSection(day.classics)+demoSection(day.demos)+simpleSection('case','重点案例',day.case,'case')+simpleSection('authority','权威论述',day.authority,'authority')+simpleSection('review','到期复习',day.review,'review');
  newer.disabled=currentIndex===0;older.disabled=currentIndex===days.length-1;
  document.body.classList.toggle('recall-mode',!!state.recall);recallToggle.classList.toggle('active',!!state.recall);recallToggle.textContent=state.recall?'退出背诵模式':'背诵模式';updateProgress();window.scrollTo({top:0});
}
function updateProgress(){const cards=[...content.querySelectorAll('[data-memory-id]')],done=cards.filter(card=>state.learned[card.dataset.memoryId]).length;progressText.textContent=`已背 ${done} / ${cards.length}`;progressBar.style.width=cards.length?`${Math.round(done/cards.length*100)}%`:'0%'}
dateSelect.innerHTML=days.map(day=>`<option value="${esc(day.date)}">${esc(day.date)}</option>`).join('');
dateSelect.onchange=()=>{currentIndex=Math.max(0,days.findIndex(day=>day.date===dateSelect.value));render()};
newer.onclick=()=>{if(currentIndex>0){currentIndex--;render()}};older.onclick=()=>{if(currentIndex<days.length-1){currentIndex++;render()}};
recallToggle.onclick=()=>{state.recall=!state.recall;save();render()};
resetProgress.onclick=()=>{const prefix=`${days[currentIndex].date}:`;Object.keys(state.learned).filter(key=>key.startsWith(prefix)).forEach(key=>delete state.learned[key]);save();render()};
content.addEventListener('change',event=>{if(!event.target.matches('.learned input'))return;const card=event.target.closest('[data-memory-id]');state.learned[card.dataset.memoryId]=event.target.checked;save();updateProgress()});
content.addEventListener('click',event=>{const button=event.target.closest('.reveal');if(button)button.closest('.memory-card').classList.add('revealed')});
render();
</script>
</body>
</html>
