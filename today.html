7-27：涉灾网络谣言治理、群众求助办理、红树林保护、资本市场刑事司法。"]},{"date":"2026-08-08","title":"今日申论好文与金句积累（2026年8月8日）","titles":["《以安全底座托举高质量发展》《让养老服务从“有人管”走向“管得准”》《把防台风预警转化为避险行动》"],"expressions":["G576：高质量发展的底气，既来自增长曲线，也来自粮食、能源和公共安全的坚实底座。——原创","G580：养老政策要落到人，必须先把能力评估、服务转介和补贴发放做成闭环。——原创","G581：公共安全的关键一环，是把预警信息变成到村到户到人的避险行动。——原创","G586：要完善风险排查、预警叫应、人员转移、交通保通、安置服务和复盘整改链条。——原创","G590：把底线守牢、把服务做细、把责任压实，平安中国的根基就会更加稳固。——原创"],"case":["重庆以工资专户、信用惩戒、数字风险“吹哨”和“渝薪码”投诉治理非工程建设领域欠薪。"],"authority":["Q154“要坚持高质量发展和高水平安全相互促进，努力提升粮食能源资源安全保障能力。”"],"classics":[{"quote":"“安而不忘危，存而不忘亡，治而不忘乱。”——《周易·系辞下》","fields":{"字面解释":"安定时不忘危险，生存时不忘衰亡，治理有序时不忘动乱。","申论释义":"治理要有忧患意识和底线思维，越是平稳越要预判风险。","适用主题":"发展和安全、粮食能源安全、防灾减灾、公安主防。","使用边界":"不能把忧患意识写成保守不作为，应落实到监测、预案和责任链。","原创使用例句":"粮食能源安全和台风防御都说明“安而不忘危”，地方既要稳生产、保供应，也要把极端天气下的物资调度、交通保通和群众转移预案做实。——原创"}},{"quote":"“仓廪实而知礼节，衣食足而知荣辱。”——《管子·牧民》","fields":{"字面解释":"粮仓充实后人民懂得礼节，衣食充足后人民懂得荣辱。","申论释义":"民生基础稳固，社会治理和文明建设才有坚实根基。","适用主题":"粮食安全、民生保障、共同富裕、基层治理。","使用边界":"不能将物质保障绝对化，还要结合精神文明、法治秩序和公共服务。","原创使用例句":"端稳粮食饭碗不是农业部门一隅之事，而是“仓廪实而知礼节”的治理前提，只有保供稳价、农民增收、储备有序，社会预期才会更稳。——原创"}},{"quote":"“老吾老以及人之老。”——《孟子·梁惠王上》","fields":{"字面解释":"尊敬自己的老人，并推广到尊敬别人的老人。","申论释义":"养老服务要从家庭责任扩展为社会支持和公共制度安排。","适用主题":"老龄化治理、失能照护、社区服务、民生保障。","使用边界":"不能只作情感号召，要写清评估、照护、补贴和监管机制。","原创使用例句":"“老吾老以及人之老”落到今天，就是社区医生上门评估、养老机构精准照护、政府补贴直达需求，让失能老人不因行动不便被公共服务遗漏。——原创"}},{"quote":"“不谋万世者，不足谋一时；不谋全局者，不足谋一域。”——陈澹然《寤言二·迁都建藩议》","fields":{"字面解释":"不能为长远谋划，就难以处理当前；不能为全局谋划，就难以治理局部。","申论释义":"解决局部问题要有系统眼光和长远安排。","适用主题":"生态治理、区域发展、基础设施、城市治理。","使用边界":"长远谋划不能替代当下执行，应落到阶段目标和责任分工。","原创使用例句":"内蒙古“以路治沙”正体现“不谋全局者，不足谋一域”，穿沙公路既切分沙地、带动绿化，也联通产业和民生，形成长期综合效益。——原创"}},{"quote":"“凡事预则立，不预则废。”——《礼记·中庸》","fields":{"字面解释":"任何事情预先准备就能成立，不预先准备就会失败。","申论释义":"公共安全治理重在预案、演练、预警和前置处置。","适用主题":"防台风、防汛救灾、基层应急、公安主防。","使用边界":"预防不能停留在纸面预案，要通过演练和现场处置检验。","原创使用例句":"台风“白海豚”防范再次提醒我们“凡事预则立”，船只回港、游客叫应、特殊群体帮扶和道路管控都要赶在风险到来前完成。——原创"}},{"quote":"“治国有常，而利民为本。”——《淮南子·氾论训》","fields":{"字面解释":"治理国家有常道，而以有利于人民为根本。","申论释义":"制度创新和数字治理最终要服务群众权益和生活安定。","适用主题":"劳动权益、基层治理、数字监管、法治政府。","使用边界":"不能把“利民”泛化为空话，应写清制度工具和救济路径。","原创使用例句":"重庆治理非工程建设领域欠薪，正是“治国有常，而利民为本”的具体化，用工资专户、信用惩戒和“渝薪码”让劳动者维权更有底气。——原创"}}],"demos":[{"title":"“安而不忘危”对应粮食能源安全","fields":{"推荐位置":"开头或问题分析段，用于引出发展和安全的关系。","原创申论段落":"“安而不忘危，存而不忘亡，治而不忘乱。”粮食和能源供应越稳定，越要看到极端天气、外部市场和产业链波动带来的不确定性。人民日报关于“两个饭碗”的报道启示我们，安全不是静态结果，而是良田保护、种业创新、能源多元、储备调度和应急保供共同形成的动态能力。只有把底线思维嵌入日常治理，发展才能行稳致远。——原创","使用点评":"古文先立忧患意识，再接粮食能源案例，最后收束到能力建设，适合安全发展类大作文。"}},{"title":"“凡事预则立”对应台风防御","fields":{"推荐位置":"对策段，用于论证“预防在先、行动到人”。","原创申论段落":"“凡事预则立，不预则废。”台风“白海豚”登陆前，国家防办和应急管理部会商部署并印发防台风措施，关键就在于把风险想在前、把责任落到人。基层应围绕船只回港、游客劝返、重点部位排查、特殊群体帮扶和交通秩序维护建立清单，确保预警能叫应、群众能转移、安置能保障，以主动防御减少灾害损失。——原创","使用点评":"引语直接服务防灾对策，案例和措施一一对应，适合公安岗公共安全段落。"}}],"review":["1日复习： 2026-08-07。复盘扩大内需、正确政绩观、红山文化、藏羚羊保护、重庆制造出海；重点背G561、G566、G571、Q152。","3日复习： 2026-08-05。复盘规范涉企执法、基层首诊、青年就业、背包城管、九五普法；重点背G531、G534、G541、Q143。","7日复习： 2026-08-01。复盘扫黑除恶、退役军人服务、家政员工制、重庆地灾监测、健康中国；重点背G486、G491、G500、Q133。","14日复习： 2026-07-25。复盘公安高效能治理、智慧110、金融服务乡村、防台风应急转移和基础研究人才；重点背Q117、G430、G437和“工欲善其事，必先利其器”。"]},{"date":"2026-08-07","title":"今日申论好文与金句积累（2026年8月7日）","titles":["《让内需主动力扎根人民美好生活》《守护文明根脉 厚植文化自信》《以品质品牌托举“重庆造”出海》"],"expressions":["G561：内需的根基在民生，动力在信心，关键在优质供给与真实需求的双向奔赴。——原创","G564：惠民生不是消费的附属项，而是释放消费潜力、稳定发展预期的基础项。——原创","G566：生态保护既要守住栖息地和迁徙通道，也要回应社区生计和人兽冲突等现实关切。——原创","G571：要把就业增收、以旧换新、社区服务、城市更新和消费场景培育统筹起来。——原创","G575：当品质成为承诺、品牌赢得信任、产业形成合力，开放发展的路就会越走越宽。——原创"],"case":["重庆摩托车以材料工艺攻关、国际认证、赛事验证和差异化产品进入欧洲高端市场，体现从价格竞争转向品质品牌竞争。"],"authority":["Q152“要坚持扩大内需这个战略基点，坚持惠民生和促消费、投资于物和投资于人紧密结合。”"],"classics":[{"quote":"“民为贵，社稷次之，君为轻。”——《孟子·尽心下》","fields":{"字面解释":"人民最重要，国家社稷其次，君主的地位相对较轻。","申论释义":"治理和发展必须把群众利益、群众感受置于重要位置。","适用主题":"为民服务、扩大内需、民生保障、正确政绩观。","使用边界":"不宜脱离现代制度语境作简单引申，应落到公共服务、民生实事和群众评价。","原创使用例句":"扩大内需要坚持“民为贵，社稷次之，君为轻”，把就业增收、社区服务和城市更新办到群众心坎上，让改善生活与提振消费相互促进。——原创"}},{"quote":"“取之有度，用之有节，则常足。”——《资治通鉴·唐纪·太宗贞观十一年》","fields":{"字面解释":"取用有一定限度，使用有节制，就能经常充足。","申论释义":"资源利用和公共投入要坚持节约集约、注重绩效。","适用主题":"绿色发展、财政绩效、消费观、生态保护。","使用边界":"节约不是压缩必要民生投入，也不能把合理消费简单等同于浪费。","原创使用例句":"生态保护与消费升级都应遵循“取之有度，用之有节，则常足”，既推动绿色产品和服务供给，也以制度引导节约资源、减少无效消耗。——原创"}},{"quote":"“人无远虑，必有近忧。”——《论语·卫灵公》","fields":{"字面解释":"人如果没有长远考虑，必然会有眼前的忧患。","申论释义":"治理要重视前瞻规划和风险防范，不能只盯短期成效。","适用主题":"生态文明、公共安全、产业规划、城市治理。","使用边界":"远虑不能代替当下行动，应将长期目标细化为阶段任务和可检验指标。","原创使用例句":"藏羚羊种群恢复后仍面临气候变化和人兽冲突，正说明“人无远虑，必有近忧”，生态治理必须从救护个体走向守护栖息地和迁徙通道。——原创"}},{"quote":"“天下难事必作于易，天下大事必作于细。”——《老子》第六十三章","fields":{"字面解释":"天下难事都从容易处做起，天下大事都从细微处做起。","申论释义":"大治理要靠小切口、细措施和持续落实。","适用主题":"基层治理、文化保护、民生实事、作风建设。","使用边界":"不能只写琐碎服务而忽略系统统筹，细处发力须服从整体目标。","原创使用例句":"红山文化保护既需重大考古工程，也离不开文物建档、环境监测、展陈改进和研学规范等细事，正是“天下大事必作于细”的当代实践。——原创"}},{"quote":"“源不深而望流之远，根不固而求木之长。”——魏征《谏太宗十思疏》","fields":{"字面解释":"水源不深却希望水流长远，树根不牢却希望树木长高，是不可能的。","申论释义":"高质量发展必须夯实基础能力，不能追逐表面速度。","适用主题":"制造强国、产业升级、营商环境、基层基础。","使用边界":"打基础不能等同于保守守成，还要以创新打开新的增长空间。","原创使用例句":"重庆摩托车进军欧洲高端市场说明“源不深而望流之远，根不固而求木之长”不可取，企业必须用技术攻关、质量认证和品牌服务夯实根基。——原创"}},{"quote":"“穷则独善其身，达则兼善天下。”——《孟子·尽心上》","fields":{"字面解释":"困顿时先修养自身，显达时帮助天下人。","申论释义":"个人、企业和社会组织都应承担与自身能力相适应的责任。","适用主题":"社会责任、企业发展、公益服务、文明建设。","使用边界":"不宜把公益责任替代政府基本公共服务职责，应强调多元主体协同。","原创使用例句":"企业参与社区服务、绿色生产和文物保护，是“达则兼善天下”的现代展开；政府也应以规则激励、信息公开和公平监管，引导社会力量有序参与。——原创"}}],"demos":[{"title":"“民为贵，社稷次之，君为轻”对应扩大内需","fields":{"推荐位置":"开头或分论点段，用于论证“发展必须落到民生福祉”。","原创申论段落":"“民为贵，社稷次之，君为轻。”扩大内需的深层逻辑，在于把人民对美好生活的需要转化为高质量发展的持久动力。人民日报报道表明，城市更新、养老托育、就业增收既是群众关切，也是消费增长的重要支点。各地应把惠民生和促消费结合起来，补齐社区服务短板，增加优质供给，让群众有稳定收入、敢于消费、乐于消费，在民生改善中激活经济循环。——原创","使用点评":"古文先立人民立场，材料连接民生和消费，对策落到收入、服务与供给，适合经济民生类大作文。"}},{"title":"“人无远虑，必有近忧”对应生态保护","fields":{"推荐位置":"问题分析或对策段，用于论证“生态保护必须动态治理”。","原创申论段落":"“人无远虑，必有近忧。”藏羚羊种群恢复是生态保护的可喜成果，但气候变化、迁徙通道受阻和人兽冲突等问题也在出现。生态治理不能满足于一时的数量增长，而应完善跨区域联合巡护、关键栖息地监测、伤害补偿和社区共管机制。既保护好高原生灵，也兼顾牧民生产生活，才能把阶段性成效转化为人与自然和谐共生的长远基础。——原创","使用点评":"以“远虑”引出新风险，用当天案例避免空泛，再写监测、补偿、共管等可操作对策。"}}],"review":["1日复习： 2026-08-06。复盘基层减负、制造“三个转变”、订单农业、防汛防台风；重点背G546、G552、G556、Q147。","3日复习： 2026-08-04。复盘数智应急、平台法治、野游安全、防汛会商；重点背G517、G521、G527、Q142。","7日复习： 2026-07-31无每日文件，补复盘2026-07-30。复盘为民服务、反网络暴力、青年就业、文化传承；重点背G431、G437、G443、Q127。","14日复习： 2026-07-24。复盘生态保护、乡村振兴、公共法律服务和基层实干；重点背当期“今日必背”及一条传统表达。"]},{"date":"2026-08-06","title":"今日申论好文与金句积累（2026年8月6日）","titles":["《以减负增效激活基层实干动能》《让订单农业联出农民增收确定性》《把防汛“风险账”算成群众“平安账”》"],"expressions":["G546：基层治理的成色，不在材料摞得多高，而在群众难题解决得多实。——原创","G549：减负只有嵌入清单管理、数据共享和监督纠偏，才能避免“文件减负、实际加码”。——原创","G552：订单农业的价值，不是替农民包销一季收成，而是帮助农民进入稳定、规范、增值的产业链。——原创","G556：要用履职事项清单明权责、用“一表通”减报表、用常态监督治加码、用资源下沉强能力。——原创","G559：当风险有人研判、预警有人叫应、转移有人组织、救援有人保障，平安才有最可靠的底座。——原创"],"case":["四川内江订单农业：以“龙头企业+合作社+农户”贯通良种、技术、保底收购和加工，带动农户稳定增收。"],"authority":["Q147“健全防治形式主义、官僚主义制度机制，持续为基层减负。”"],"classics":[{"quote":"“思所以危则安矣，思所以乱则治矣，思所以亡则存矣。”——《贞观政要·君道》","fields":{"字面解释":"思考可能导致危险的因素就能安定，思考可能导致混乱的因素就能治理，思考可能导致灭亡的因素就能保存。","申论释义":"治理要有底线思维和风险预判，把问题想在前、措施做在前。","适用主题":"防汛防台风、公共安全、应急管理、公安主防。","使用边界":"不能把风险预判写成无限加码或过度管控，要以科学研判、分类响应为前提。","原创使用例句":"面对台风“白海豚”和局地强降雨，须以“思所以危则安矣”核清风险部位和转移对象，把叫应、巡查、管控和救援预置在险情之前。——原创"}},{"quote":"“言必信，行必果。”——《论语·子路》","fields":{"字面解释":"说话一定守信用，行动一定有结果。","申论释义":"政策承诺、为民服务和基层治理要重执行、见实效。","适用主题":"作风建设、政务诚信、基层服务、营商环境。","使用边界":"不能理解为不顾实际机械兑现，应依法依规、及时解释和动态优化。","原创使用例句":"整治形式主义不能停在会议和口号上，要以“言必信，行必果”的态度公开减负清单、压实整改时限，让基层干部和群众看到可感可及的变化。——原创"}},{"quote":"“其身正，不令而行；其身不正，虽令不从。”——《论语·子路》","fields":{"字面解释":"自身端正，即使不下命令，人们也会行动；自身不端正，即使下命令，人们也不会服从。","申论释义":"干部作风和示范行为是基层治理的无形规则。","适用主题":"党建引领、作风建设、执法规范化、基层治理。","使用边界":"示范带头不能替代制度约束，仍要靠公开监督和责任机制固化成效。","原创使用例句":"福州以党员帮办代办、村医随访回应群众急难愁盼，说明“其身正，不令而行”，干部先沉下去、先办实事，群众参与治理才会更主动。——原创"}},{"quote":"“泰山不让土壤，故能成其大；河海不择细流，故能就其深。”——李斯《谏逐客书》","fields":{"字面解释":"泰山不拒绝细小土壤，所以能成就高大；河海不排斥细小水流，所以能汇成深广。","申论释义":"创新发展需要汇聚人才、技术、资本和数据等多元要素。","适用主题":"科技创新、制造强国、人才发展、营商环境。","使用边界":"开放汇聚不等于没有筛选，应守住安全、质量和公平竞争底线。","原创使用例句":"制造业攻关应懂得“泰山不让土壤，故能成其大”，既支持龙头企业牵头，也让高校团队、中小企业和应用场景共同参与，形成协同创新合力。——原创"}},{"quote":"“积土而为山，积水而为海。”——《荀子·儒效》","fields":{"字面解释":"堆积土壤成为山，汇集水流成为海。","申论释义":"高质量发展和基层治理都要坚持长期主义、久久为功。","适用主题":"作风建设、制造升级、乡村振兴、能力建设。","使用边界":"长期积累不等于低效重复，要有阶段目标和成效评估。","原创使用例句":"河南制造从核心零部件攻关到质量品牌提升，印证“积土而为山，积水而为海”，关键技术能力来自持续投入、反复试验和长期协同，而非一时热度。——原创"}},{"quote":"“博学之，审问之，慎思之，明辨之，笃行之。”——《礼记·中庸》","fields":{"字面解释":"广泛学习，详细询问，谨慎思考，清楚辨别，切实实行。","申论释义":"调查研究和科学决策要经历学习、求证、分析、判断和落实的完整过程。","适用主题":"调查研究、科学决策、科技科普、基层治理。","使用边界":"不能把程序写成空转流程，关键是让调研结论进入行动和评价环节。","原创使用例句":"从科普辨伪到创新转化，都需要“博学之，审问之，慎思之，明辨之，笃行之”，以权威知识提升公众判断力，再以真实需求反哺科技创新。——原创"}}],"demos":[{"title":"“思所以危则安矣”对应防汛防台风","fields":{"推荐位置":"分论点段，用于论证“公共安全必须前置预防”。","原创申论段落":"“思所以危则安矣，思所以乱则治矣。”防汛防台风不能等险情出现后再仓促应对。应急管理部会商要求厘清风险账、下好一盘棋，启示基层须将病险水库、漫水路桥、景区工地和特殊群体逐项建档，并以预警叫应、转移避险、力量预置和统一指挥打通行动链。把最坏情形想在前、把最实措施做在前，才能守住群众生命财产安全。——原创","使用点评":"先用古文压住“预防”主旨，再接当天会商案例，最后落到风险清单和行动清单，适合应急、安全类作文。"}},{"title":"“泰山不让土壤，故能成其大”对应制造升级","fields":{"推荐位置":"分论点段，用于论证“科技创新要汇聚协同力量”。","原创申论段落":"“泰山不让土壤，故能成其大；河海不择细流，故能就其深。”制造强国不是少数龙头企业的独角戏。河南盾构装备攻克关键部件，靠的是企业研发投入、科研院所协同、试验平台验证和市场场景反馈共同发力。各地应建好公共技术平台，畅通人才、资本、数据和订单要素，让大企业顶天立地、小企业铺天盖地，共同托举产业向高端迈进。——原创","使用点评":"引语自然引出“汇聚要素”，案例说明协同机制，对策落到平台和要素供给，避免把创新写成单一补贴。"}}],"review":["1日复习： 2026-08-05。复盘规范涉企执法、基层首诊、青年就业、四川“背包城管”、九五普法；重点背G531、G534、G541、Q143。","3日复习： 2026-08-03无每日文件，补复盘2026-08-02。复盘正确政绩观、消费新场景、特殊场所防汛转移；重点背G501、G507、G512、Q138。","7日复习： 2026-07-30。复盘为民服务、反网络暴力、青年就业、文化传承；重点背G431、G437、G443、Q127。","14日复习： 2026-07-23。复盘退役军人服务、数字乡村、生态保护与执法规范化；重点背当期“今日必背”并各写一句迁移表达。"]},{"date":"2026-08-05","title":"今日申论好文与金句积累（2026年8月5日）","titles":["以规范执法厚植营商环境沃土","把基层首诊做成群众放心首选","以普法融入治理筑牢法治社会根基"],"expressions":["G531：营商环境的温度，既体现在政策红利里，也体现在每一次执法检查的尺度中。","G534：规范涉企执法，核心是用清单约束权力、用协同减少扰动、用服务促进整改。","G539：从“有机构”到“信得过”，中间隔着质量、责任和连续服务三道关口。","G541：要完善入企检查备案、扫码留痕、部门联合、问题告知、整改回访和监督评价机制。","G545：让法律走进执法现场、群众身边和企业日常，法治社会才会更有根基。"],"case":["四川巴中“背包城管”： 巴中综合行政执法人员带着工具、手册和民情记录本走街串巷，推动城市管理从被动接单转向主动靠前。可迁移为“干部下沉—现场发现—就地处置—帮办代办—复盘改进”的基层治理链条。"],"authority":["Q143： “要强化执法监督，集中整治乱收费、乱罚款、乱检查、乱查封，切实依法保护民营企业和民营企业家合法权益。”"],"classics":[{"quote":"“法令行则国治，法令弛则国乱。”——王符《潜夫论·述赦》","fields":{"字面解释":"法令得到执行，国家就治理有序；法令松弛废弛，国家就容易混乱。","申论释义":"规范涉企执法和“谁执法谁普法”都强调规则统一、执行有度、监督有力。","适用主题":"执法规范化、法治政府、营商环境、公安岗。","使用边界":"不能把严格执行写成机械执法，应同时强调程序、比例原则和服务整改。","原创使用例句":"涉企检查必须记住“法令行则国治，法令弛则国乱”，既不能任性扰企，也不能放松监管，而要在清单、留痕和监督中把法治尺度立起来。——原创"}},{"quote":"“上医医国，其次疾人。”——《国语·晋语八》","fields":{"字面解释":"最高明的医生治理国家，其次才是医治人的疾病。","申论释义":"健康治理不仅是治病，还包括制度设计、基层能力和公共政策。","适用主题":"健康中国、基层首诊、公共服务、民生治理。","使用边界":"不能把医疗问题泛化为抽象治国议论，仍要落到诊疗质量和服务流程。","原创使用例句":"基层首诊从“有”到“优”，正体现“上医医国，其次疾人”的治理思路：既提升医生能力，也重塑医联体、转诊和慢病管理体系。——原创"}},{"quote":"“足国之道，节用裕民。”——《荀子·富国》","fields":{"字面解释":"使国家富足的方法，在于节制用度并使人民宽裕。","申论释义":"公共资源配置要讲绩效，基层服务要把有限资金用到群众真实需求上。","适用主题":"基层治理、民生保障、财政绩效、公共服务。","使用边界":"不能理解为单纯压缩投入，重点是优化结构、提高效能。","原创使用例句":"“背包城管”把小修小补、帮办代办带到现场，正是把资源用在群众急需处，以“节用裕民”的思路提升治理效能。——原创"}},{"quote":"“宽则得众，信则人任焉。”——《论语·阳货》","fields":{"字面解释":"宽厚就能得到众人拥护，守信就能得到别人任用和信任。","申论释义":"政府服务、执法活动和就业帮扶都要靠稳定预期与可信承诺赢得群众和企业信任。","适用主题":"群众路线、营商环境、青年就业、基层服务。","使用边界":"“宽”不是放任失序，“信”也必须建立在依法依规和履约践诺上。","原创使用例句":"青年就业帮扶要做到“宽则得众，信则人任焉”，既耐心识别毕业生困难，也兑现岗位推介、能力培训和后续回访承诺。——原创"}},{"quote":"“治世不一道，便国不必法古。”——《商君书·更法》","fields":{"字面解释":"治理国家不只有一种道路，有利于国家就不必拘泥古法。","申论释义":"数字就业、扫码入企、背包城管等创新方式，都是因时因地改进治理工具。","适用主题":"改革创新、数字治理、基层治理、现代化产业体系。","使用边界":"创新不能突破法治底线，改革要有评估、监督和纠偏机制。","原创使用例句":"从“扫码入企”到“背包城管”，都说明“治世不一道，便国不必法古”，基层治理要根据问题形态更新工具和流程。——原创"}},{"quote":"“有教无类。”——《论语·卫灵公》","fields":{"字面解释":"教育不分贵贱贤愚，对各类人都应施教。","申论释义":"法治宣传、就业服务和公共教育要面向不同群体精准供给，不让任何人掉队。","适用主题":"全民普法、青年就业、基层公共服务、社会公平。","使用边界":"不能停留在平均化供给，应强调分类施策和精准服务。","原创使用例句":"“九五”普法应体现“有教无类”，既面向领导干部、青少年和企业经营者，也走进社区、校园、网络平台和新就业群体。——原创"}}],"demos":[{"title":"“法令行则国治，法令弛则国乱”对应规范涉企执法","fields":{"推荐位置":"对策段，用于论证“严格规范公正文明执法”。","原创申论段落":"“法令行则国治，法令弛则国乱。”规范涉企执法不是降低监管要求，而是让每一次检查都有依据、有边界、有回访。人民日报报道浙江“综合查一次”、深圳“扫码入企”，说明基层可通过事项清单、联合检查、扫码留痕和整改服务减少扰企。只有把权力关进流程，把服务送到企业，营商环境才能既有秩序也有活力。——原创","使用点评":"古文压住法治主题，案例承接当天报道，分析兼顾严格执法和保护经营主体，适合公安岗涉企服务题。"}},{"title":"“上医医国，其次疾人”对应基层首诊","fields":{"推荐位置":"分论点段，用于论证“民生治理要从体系能力入手”。","原创申论段落":"“上医医国，其次疾人。”让基层首诊成为群众放心选择，不能只靠一间诊室、一名医生单兵作战。人民日报政策问答显示，专家下沉、远程诊疗、医联体协同和慢病管理正在补齐基层短板。下一步还要打通检查互认、双向转诊和医保支付，让家门口医疗既看得上病，也看得好病。——原创","使用点评":"引语用于打开制度视角，避免泛谈看病便利，后半段落到医疗质量、资源下沉和流程衔接。"}}],"review":["1日复习：2026-08-04——到期：数智技术赋能基层应急、平台经济法治、汛期野游安全、防汛滚动会商。","3日复习：2026-08-02——到期：正确政绩观、科创成果转化、消费新场景、特殊场所防汛转移。","7日复习：2026-07-29——当日无本地每日积累文件；本轮补复习2026-07-30“基层实事办理、反网络暴力、精准就业、重庆融入统一大市场”。","14日复习：2026-07-22——到期：防汛救灾社会动员、生态环境公益诉讼、基层应急协同、公安岗公共安全表达。"]},{"date":"2026-08-04","title":"今日申论好文与金句积累（2026年8月4日）","titles":["把数智技术嵌入基层应急行动链","以法治边界护航平台经济健康成长","让每一次会商都落成一线避险动作"],"expressions":["G516：越是风高浪急，越要用战略定力稳住发展航向，用改革创新拓展前行空间。","G520：技术赋能基层，应当减少重复填报、压实真实责任、提升现场处置效率。","G521：保护消费者权益不是给平台发展设障，而是为长期创新积累信任资本。","G525：数据能把风险照亮，却不能替代干部到场、群众转移和救援保障。","G530：让预警有人接、险情有人巡、群众有人护，平安才能从口号变成可感的日常。"],"case":["强降水滚动会商调度： 国家防总办公室、应急管理部8月4日针对陕西、湖北、云南等地强降水滚动会商调度，要求重点地区做好防汛工作。可迁移为“研判—巡查—转移—救助—复盘”的基层应急链条。"],"authority":["Q140： “着力提高防范应对自然灾害能力，切实维护人民群众生命财产安全。”"],"classics":[{"quote":"“居安思危，思则有备，有备无患。”——《左传·襄公十一年》","fields":{"字面解释":"安定时想到危险，想到危险就有准备，有准备就能避免祸患。","申论释义":"防汛、应急和经济治理都要把风险预判前置。","适用主题":"基层应急、公共安全、宏观治理、公安主防。","使用边界":"不能把忧患意识写成悲观保守，关键在提前准备和科学行动。","原创使用例句":"面对强降水和“野游热”叠加风险，基层更要懂得“居安思危，思则有备，有备无患”，把预警、巡查、劝导和转移做在事故之前。——原创"}},{"quote":"“法者，治之端也。”——《荀子·君道》","fields":{"字面解释":"法度是治理的开端和基础。","申论释义":"平台经济、消费权益和营商环境需要以法治明确边界。","适用主题":"平台经济、消费者保护、执法规范化、法治政府。","使用边界":"不能把法治简化为事后处罚，应强调规则引导和救济闭环。","原创使用例句":"平台交易纠纷提醒我们，“法者，治之端也”，只有把信息披露、责任认定和投诉救济写清楚，数字经济才能在公平秩序中持续成长。——原创"}},{"quote":"“凡治国之道，必先富民。”——《管子·治国》","fields":{"字面解释":"治理国家的重要方法，首先在于使人民富足。","申论释义":"高质量发展最终要落到就业、收入、消费和公共服务改善上。","适用主题":"高质量发展、扩大内需、民生保障、共同富裕。","使用边界":"不能只谈收入增长，还要写制度供给和发展质量。","原创使用例句":"中国经济行稳致远，归根到底要回应“凡治国之道，必先富民”，把产业升级、就业服务和消费场景转化为群众可感的获得。——原创"}},{"quote":"“为之于未有，治之于未乱。”——《老子》第六十四章","fields":{"字面解释":"事情尚未发生时就着手处理，混乱尚未形成时就加以治理。","申论释义":"风险治理要从源头排查、预警触发和前端处置入手。","适用主题":"公共安全、基层应急、风险防控、公安主防。","使用边界":"预防不能替代依法处置，发现现实违法和现实险情仍须果断行动。","原创使用例句":"汛期户外安全治理应坚持“为之于未有，治之于未乱”，在热门线路、涉水区域和网络约伴环节提前提示、劝阻和联动处置。——原创"}},{"quote":"“不患寡而患不均，不患贫而患不安。”——《论语·季氏》","fields":{"字面解释":"不只担心财富少，更担心分配不公平；不只担心贫穷，更担心社会不安定。","申论释义":"平台经济和市场治理要兼顾效率、公平和秩序。","适用主题":"平台治理、营商环境、社会公平、消费者权益。","使用边界":"不能否定效率和创新，应强调公平规则支撑长远效率。","原创使用例句":"数字平台追求效率无可厚非，但“不患寡而患不均，不患贫而患不安”，若规则失衡、维权困难，市场活力也会被信任赤字消耗。——原创"}},{"quote":"“天下之事，不难于立法，而难于法之必行。”——张居正《请稽查章奏随事考成以修实政疏》","fields":{"字面解释":"天下事情，制定法律制度并非最难，难在法律制度必须得到执行。","申论释义":"清单、预案、规则和案例发布后，关键在执行闭环。","适用主题":"基层治理、应急预案、平台监管、法治政府。","使用边界":"不能只强调强执行，也要保障程序正当和群众参与。","原创使用例句":"无论是平台典型案例还是防汛会商部署，都应牢记“天下之事，不难于立法，而难于法之必行”，把制度要求落到岗位、时限和责任人。——原创"}}],"demos":[{"title":"“居安思危，思则有备，有备无患”对应防汛会商调度","fields":{"推荐位置":"分论点段，用于论证“公共安全必须前置预防”。","原创申论段落":"“居安思危，思则有备，有备无患。”防汛工作最怕把预警当消息、把会商当流程。应急管理部滚动会商陕西、湖北、云南等地强降水风险，提醒基层把雨情水情研判转化为巡堤查险、转移避险、交通管控和救灾救助。只有把准备做在雨前、把责任压到点位、把群众护在险外，才能守牢生命安全底线。——原创","使用点评":"古文引出预防逻辑，案例承接当前调度，对策落到可执行动作，适合公安岗应急类分论点。"}},{"title":"“法者，治之端也”对应平台经营典型案例","fields":{"推荐位置":"对策段，用于论证“规范是平台经济健康发展的前提”。","原创申论段落":"“法者，治之端也。”平台经济一头连着经营创新，一头连着千家万户消费权益，不能让流量逻辑凌驾于法治规则之上。最高法发布依法规范平台经营典型案例，正是通过个案裁判明确责任边界、维权路径和行业预期。下一步还需完善交易留痕、投诉救济和平台审核机制，让创新有空间、经营有底线、消费有保障。——原创","使用点评":"引语用于压住法治主题，避免空泛批评平台，后半段写出规则引导和发展保护的平衡。"}}],"review":["1日复习：2026-08-03——当日无本地每日积累文件；本轮改为快速回看2026-08-02“正确政绩观、科创转化、特殊场所防汛转移”。","3日复习：2026-08-01——到期：常态化扫黑除恶、退役军人全周期服务、家政员工制、重庆地灾监测、健康中国。","7日复习：2026-07-28——当日无本地每日积累文件；本轮补复习2026-07-30“基层实事办理、反网络暴力、精准就业、重庆融入统一大市场”。","14日复习：2026-07-21——当日无本地每日积累文件；本轮补复习2026-07-18“宏观政策、未成年人网络保护、检察监督、生物多样性司法保护”。"]},{"date":"2026-08-02","title":"今日申论好文与金句积累（2026年8月2日）","titles":["以正确政绩观校准高质量发展坐标","打通科技成果转化的“中间地带”","把每一次预警转化为避险行动"],"expressions":["G504：树立正确政绩观，要以发展规律校准工作冲动，以群众评价检验施政成色。","G505：培育新质生产力，既要增强源头创新供给，也要畅通概念验证、中试孵化和场景应用。","G509：从论文专利到产业产品，中间还隔着验证、资金、场景和市场四道关口。","G510：数据能够提前发现异常，却不能替代叫应、转移、救援和安置等线下行动。","G515：当预警有人接、群众有人转、安置有人管，安全底线才能成为可感可及的民生保障。"],"case":["密云养老照料中心灾害调查： 报告从极端降雨和洪水致灾因素，追溯到监测预警、巡堤查险、先期处置、养老监管等短板，说明自然灾害调查既要尊重科学规律，也要查清治理责任。"],"authority":["Q137： “极端灾害必须以极限思维应对。”"],"classics":[{"quote":"“祸兮福之所倚，福兮祸之所伏。”——《老子》第五十八章","fields":{"字面解释":"灾祸中可能孕育转机，福分中也可能潜藏祸患。","申论释义":"看待发展成绩与风险挑战要坚持辩证思维，在顺境中保持忧患意识。","适用主题":"统筹发展和安全、风险治理、宏观经济、改革创新。","使用边界":"不能把风险与机遇机械等同，更不能以“祸福相依”淡化现实责任。","原创使用例句":"面对经济回升向好的态势，更应懂得“福兮祸之所伏”，主动识别结构性矛盾和外部风险，以底线思维巩固发展向好基础、守牢安全底线。——原创"}},{"quote":"“知止而后有定。”——《礼记·大学》","fields":{"字面解释":"知道应达到的目标和应守的界限，志向才能坚定。","申论释义":"发展未来产业既要明确方向，也要守住能力、资源和安全边界。","适用主题":"正确政绩观、科学决策、科技伦理、干部修养。","使用边界":"“知止”不是停止改革，而是避免盲目跟风和无序扩张。","原创使用例句":"布局未来产业要“知止而后有定”，既瞄准科技前沿积极探索，也根据资源禀赋和产业基础选准赛道，避免盲目追逐风口，提升投入产出效益。——原创"}},{"quote":"“故善战者，求之于势，不责于人。”——《孙子兵法·势篇》","fields":{"字面解释":"善于用兵的人重在营造有利态势，不苛求个体凭蛮力取胜。","申论释义":"改革和创新要靠制度、平台与生态形成合力，不能把系统问题全压给个人。","适用主题":"创新生态、组织治理、干部激励、协同发展。","使用边界":"强调制度环境不等于弱化岗位责任，个人仍须依法履职、担当作为。","原创使用例句":"科技成果转化应当“求之于势，不责于人”，以概念验证、中试平台、耐心资本和应用场景形成合力，而非让科研人员独自跨越市场鸿沟。——原创"}},{"quote":"“履霜，坚冰至。”——《周易·坤卦》初六爻辞","fields":{"字面解释":"踩到薄霜，就应预见严寒和坚冰将至。","申论释义":"风险治理要从细小征兆识别趋势，把处置关口前移。","适用主题":"防灾减灾、公安主防、安全生产、廉政建设。","使用边界":"预见风险必须基于事实和专业研判，不能把一般异常随意上纲。","原创使用例句":"“履霜，坚冰至”，基层防灾要从雨情、水情和设施异常中识别险情苗头，及时叫应并转移群众，不能等灾害扩大后再被动处置，守住生命安全底线。——原创"}},{"quote":"“圣人见微以知萌，见端以知末。”——《韩非子·说林上》","fields":{"字面解释":"从细微迹象看出苗头，从事情开端推知发展结果。","申论释义":"监测预警、经济运行和基层治理都要提升早发现、早研判能力。","适用主题":"风险监测、调查研究、经济治理、矛盾排查。","使用边界":"见微知著不是主观猜测，判断必须经过数据、走访和多方验证。","原创使用例句":"做到“见微以知萌，见端以知末”，既要依靠监测数据捕捉异常，也要通过实地巡查和多方会商验证研判，把隐患消除在成灾之前。——原创"}},{"quote":"“欲筑室者，先治其基。”——北宋苏辙《新论中》","fields":{"字面解释":"想建造坚固房屋，首先要把地基打牢。","申论释义":"高质量发展、科技创新和公共安全都要先夯实基层基础与制度能力。","适用主题":"基层治理、基础研究、组织建设、公共安全。","使用边界":"强基固本不能成为迟滞行动的借口，应在补基础的同时解决紧迫问题。","原创使用例句":"“欲筑室者，先治其基”，建设全球科创高地既要争取重大成果，也要持续投入基础研究、公共平台和人才培养，夯实创新根基，增强持续创新能力。——原创"}}],"demos":[{"title":"“履霜，坚冰至”+密云灾害调查评估","fields":{"推荐位置":"分论点段，用于论证“风险处置关口必须前移”。","原创申论段落":"“履霜，坚冰至。”极端灾害往往来势迅猛，但风险演化并非毫无征兆。密云养老照料中心灾害调查从监测预警、巡堤查险、先期处置和养老监管等环节追溯短板，警示基层不能把一般雨情当作寻常情况。应健全多源监测、分级叫应和特殊群体转移机制，以极限思维把工作做在险情扩大之前。——原创","使用点评":"古文用来引出“见小知大、关口前移”，调查报告提供现实支撑，对策回应问题；不能脱离监测数据主观放大一般异常。"}},{"title":"“故善战者，求之于势，不责于人”+上海科创高地建设","fields":{"推荐位置":"分论点段，用于论证“创新依靠生态而非个人单打独斗”。","原创申论段落":"“故善战者，求之于势，不责于人。”推动科技成果从实验室走向生产线，不能只要求科研人员既懂研究又懂市场。上海建设全球科创高地，启示各地完善概念验证、中试孵化、耐心资本和场景开放机制，推动高校、企业与服务机构协同发力。以制度平台营造创新之“势”，才能让更多成果跨越转化鸿沟。——原创","使用点评":"先把“势”转译为创新生态，再用当日好文承接，最后列出制度工具；同时保留科研人员和企业的主体责任，避免把古文理解为“不责于人”。"}}],"review":["1日复习：2026-08-01——到期：常态化扫黑除恶、退役军人全周期服务、家政员工制、重庆地灾监测、健康中国。","3日复习：2026-07-30——到期：基层实事办理、反网络暴力、精准就业、广东文化传承、重庆融入统一大市场。","7日复习：2026-07-26——到期：统一大市场、重庆城口“熟人社区”、防汛避险转移、数据要素、检察法律监督。","14日复习：2026-07-19——当日无每日积累文件，本轮补复习2026-07-18：随机复述3个主题、2条金句和1条权威论述。"]},{"date":"2026-08-01","title":"今日申论好文与金句积累（2026年8月1日）","titles":["让平安建设既有打击力度更有治理精度","用“电子哨兵”守牢基层防灾第一线","从疾病诊疗迈向全生命周期健康治理"],"expressions":["G489：深化扫黑除恶，必须在依法严惩中保持力度，在实事求是中把准尺度。","G491：基层防灾要让技术监测看得见风险，让网格力量找得到群众，让应急机制跑得赢灾情。","G494：从政策覆盖到服务抵达，中间还隔着需求识别、资源匹配和跟踪反馈三道关口。","G496：要贯通群众举报、数据研判、案件侦办、打伞破网、行业整治和回访评估，形成常态治理闭环。","G500：让人人享有可及、连续、有温度的健康服务，现代化建设才有更加坚实的民生底座。"],"case":["重庆涪陵地灾防线： GNSS“电子哨兵”+网格巡查+道路管控+24小时值守+群众转移，体现技术监测与基层动员协同。"],"authority":["Q133： “要严格依法办事，坚持实事求是，做到是黑恶一个不漏、不是黑恶一个不凑。”"],"classics":[{"quote":"“为政之要，惟在得人，用非其人，必难致治。”——唐·吴兢《贞观政要》","fields":{"字面解释":"治理国家的关键在于选用合适人才，用人不当就难以达到善治。","申论释义":"基层治理、公共卫生和应急处置都需要专业力量与合适岗位精准匹配。","适用主题":"干部队伍、人才强国、基层治理、公共服务。","使用边界":"不能把治理成效完全归因于个人，还须强调制度、资源和监督保障。","原创使用例句":"退役军人服务要落实“为政之要，惟在得人”，既精准识别个人专长，也用岗位开发、技能培训和跟踪帮扶让人岗相适，实现才尽其用、人尽其才。——原创"}},{"quote":"“知是行之始，行是知之成。”——明·王守仁《传习录上》","fields":{"字面解释":"认识是行动的开始，行动是认识的完成。","申论释义":"风险意识、为民理念和法治要求必须转化为具体行动与治理成效。","适用主题":"实干担当、调查研究、应急管理、政策落实。","使用边界":"不能以“重行动”为由忽视科学论证和依法决策。","原创使用例句":"“知是行之始，行是知之成”，地灾监测不能止于发现位移数据，更要及时叫应、转移群众、管控道路，把风险认知变成避险行动，守住生命安全底线。——原创"}},{"quote":"“取法于上，仅得为中；取法于中，故为其下。”——唐·李世民《帝范》卷四","fields":{"字面解释":"以上等标准为目标，结果可能只达中等；以中等为目标，结果往往落到下等。","申论释义":"改革和公共服务应确立高标准，并以可检验的制度持续推进。","适用主题":"高质量发展、改革创新、作风建设、公共服务标准化。","使用边界":"高标准不等于脱离实际、层层加码，更不能制造形式主义负担。","原创使用例句":"家政服务职业化当有“取法于上”的追求，以劳动契约、技能认证和质量追溯树立行业标准，推动服务提质，同时防止脱离实际层层加码。——原创"}},{"quote":"“任贤勿贰，去邪勿疑。”——《尚书·大禹谟》","fields":{"字面解释":"任用贤能不要三心二意，去除不正之人不要迟疑。","申论释义":"选人用人要坚持德才兼备、奖优罚劣，形成担当作为的鲜明导向。","适用主题":"干部管理、政治生态、担当作为、人才使用。","使用边界":"“勿疑”不是主观武断，必须以事实、程序和制度为依据。","原创使用例句":"营造担当作为的干部环境，应坚持“任贤勿贰，去邪勿疑”，让实干者凭实绩脱颖而出，让失责者依规依纪受到约束，形成鲜明用人导向。——原创"}},{"quote":"“一张一弛，文武之道也。”——《礼记·杂记下》","fields":{"字面解释":"弓弦有时拉紧、有时放松，是治理和做事应有的节奏。","申论释义":"公共管理既要严格规范，也要合理调度、关爱基层、保持政策韧性。","适用主题":"基层减负、干部关爱、工作方法、社会治理。","使用边界":"张弛有度不等于降低标准或放松法治要求。","原创使用例句":"基层应急既要在险情来临时迅速进入战时状态，也要在日常合理轮班、常态演练，做到“一张一弛”而责任标准始终不松，保障队伍持续战斗力。——原创"}},{"quote":"“源清则流清，源浊则流浊。”——《荀子·君道》","fields":{"字面解释":"源头清澈，水流就清澈；源头污浊，水流也会污浊。","申论释义":"治理黑恶犯罪、行业乱象和公共风险，要抓源头、治根本、建长效。","适用主题":"源头治理、廉政建设、营商环境、社会治理。","使用边界":"源头治理不能替代对现实违法行为的及时依法处置。","原创使用例句":"“源清则流清，源浊则流浊”，深化扫黑除恶既要依法惩治现行犯罪，也要整治行业乱象、斩断利益链条，铲除黑恶滋生土壤，实现标本兼治。——原创"}}],"demos":[{"title":"“知是行之始，行是知之成”+重庆涪陵地灾监测","fields": }
function classicSection(items){
  const body=items.length?items.map((item,index)=>{const fields=Object.entries(item.fields).filter(([key])=>key!=='原创使用例句').map(([key,value])=>`<div class="field"><strong>${esc(key)}：</strong>${esc(value)}</div>`).join('');const example=item.fields['原创使用例句']?`<div class="field example"><strong>原创使用例句：</strong>${esc(item.fields['原创使用例句'])}</div>`:'';return memoryCard('classic',index,`古文${index+1}`,`<div class="classic-quote">${esc(item.quote)}</div><div class="classic-fields">${fields}${example}</div>`)}).join(''):'<div class="empty">本期未收录古文名言</div>';
  return `<section class="memory-section" id="classics"><div class="section-title"><h2>古文与名言</h2><span>${items.length}条</span></div>${body}</section>`;
}
function demoSection(items){
  const body=items.length?items.map((item,index)=>{const position=item.fields['推荐位置']||'',paragraph=item.fields['原创申论段落']||'',note=item.fields['使用点评']||'';return memoryCard('demo',index,`实战示范${index+1}`,`<div class="classic-quote">${esc(item.title)}</div>${position?`<div class="field"><strong>推荐位置：</strong>${esc(position)}</div>`:''}${paragraph?`<div class="field example"><strong>原创段落：</strong>${esc(paragraph)}</div>`:''}${note?`<div class="field"><strong>使用点评：</strong>${esc(note)}</div>`:''}`,'demo')}).join(''):'<div class="empty">本期未设置古文实战示范</div>';
  return `<section class="memory-section" id="demos"><div class="section-title"><h2>古文实战示范</h2><span>${items.length}则</span></div>${body}</section>`;
}
function render(){
  const day=days[currentIndex];
  dateSelect.value=day.date;dateLabel.textContent=`${day.date} · 当日重点`;dayTitle.textContent=day.title;
  content.innerHTML=simpleSection('titles','必背标题',day.titles,'title')+simpleSection('expressions','必背表达',day.expressions,'expression')+classicSection(day.classics)+demoSection(day.demos)+simpleSection('case','重点案例',day.case,'case')+simpleSection('authority','权威论述',day.authority,'authority')+simpleSection('review','到期复习',day.review,'review');
  newer.disabled=currentIndex===0;older.disabled=currentIndex===days.length-1;
  document.body.classList.toggle('recall-mode',!!state.recall);recallToggle.classList.toggle('active',!!state.recall);recallToggle.textContent=state.recall?'退出背诵模式':'背诵模式';updateProgress();window.scrollTo({top:0});
}
function updateProgress(){const cards=[...content.querySelectorAll('[data-memory-id]')],done=cards.filter(card=>state.learned[card.dataset.memoryId]).length;progressText.textContent=`已背 ${done} / ${cards.length}`;progressBar.style.width=cards.length?`${Math.round(done/cards.length*100)}%`:'0%'}
dateSelect.innerHTML=days.map(day=>`<option value="${esc(day.date)}">${esc(day.date)}</option>`).join('');
dateSelect.onchange=()=>{currentIndex=Math.max(0,days.findIndex(day=>day.date===dateSelect.value));render()};
newer.onclick=()=>{if(currentIndex>0){currentIndex--;render()}};older.onclick=()=>{if(currentIndex<days.length-1){currentIndex++;render()}};
recallToggle.onclick=()=>{state.recall=!state.recall;save();render()};
resetProgress.onclick=()=>{const prefix=`${days[currentIndex].date}:`;Object.keys(state.learned).filter(key=>key.startsWith(prefix)).forEach(key=>delete state.learned[key]);save();render()};
content.addEventListener('change',event=>{if(!event.target.matches('.learned input'))return;const card=event.target.closest('[data-memory-id]');state.learned[card.dataset.memoryId]=event.target.checked;save();updateProgress()});
content.addEventListener('click',event=>{const button=event.target.closest('.reveal');if(button)button.closest('.memory-card').classList.add('revealed')});
render();
</script>
</body>
</html>
